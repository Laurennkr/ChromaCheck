# Revisa cada PR y cada push a development y main: formato, lint, pruebas y compilación
name: calidad

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Formato (Prettier)
        run: npm run formato:revisar
      - name: Análisis estático (ESLint, sin advertencias)
        run: npm run lint -- --max-warnings=0
      - name: Pruebas y cobertura (Jest)
        run: npm run test:cobertura
      - name: Compilación y tipos (Next.js)
        run: npm run build

  puente:
    name: puente-serial
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: puente-serial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: puente-serial/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest
      - name: Pruebas (pytest)
        run: python -m pytest -q
